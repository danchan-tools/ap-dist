<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
        font-size: 13px;
        color: #0f172a;
        background: #fff;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      h1 span {
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
      }
      .memo {
        background: #f1f5f9;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
        line-height: 1.6;
      }
      .memo b {
        font-size: 14px;
      }
      .none {
        color: #64748b;
      }
      button {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        background: #94a3b8;
        cursor: default;
      }
      .msg {
        margin-top: 10px;
        line-height: 1.6;
        font-weight: 700;
        white-space: pre-line; /* 気になる日が複数あるときは、1行に1つ並べる */
      }
      .ok {
        color: #059669;
      }
      .warn {
        color: #d97706;
      }
      .err {
        color: #dc2626;
      }
      .hint {
        margin-top: 10px;
        color: #64748b;
        line-height: 1.6;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <h1>AutoPunch 転記 <span>保存は押しません</span></h1>
    <div id="memo" class="memo"></div>
    <div id="page" class="memo" hidden></div>
    <button id="go" disabled>読み込み中…</button>
    <div id="msg" class="msg"></div>
    <!-- autopunch.js は、AutoPunch のページの中へ送る関数を置くだけ（小窓の中では何もしない） -->
    <script src="autopunch.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
